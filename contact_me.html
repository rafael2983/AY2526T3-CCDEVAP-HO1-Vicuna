<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact</title>
</head>

<body>

    <header>

        <h1>Contact Me</h1>

        <nav>
            <p>
                <a href="index.html">Home</a> |
                <a href="about_me.html">About Me</a> |
                <a href="contact_me.html">Contact</a>
            </p>
        </nav>

        <hr>

    </header>

    <main>

        <section>

            <h2>Social Media</h2>

            <p>
                <img src="contactPage/instagram.png" alt="Instagram icon" width="30" height="30">

                <a href="https://www.instagram.com/vicunarafael86" target="_blank" rel="noopener">
                    Instagram
                </a>
            </p>

            <p>
                <img src="contactPage/twitterx.png" alt="Twitter or X icon" width="30" height="30">

                <a href="https://x.com/vicunarafael864" target="_blank" rel="noopener">
                    Twitter / X
                </a>
            </p>

            <p>
                <img src="contactPage/facebook.png" alt="Facebook icon" width="30" height="30">

                <a href="https://www.facebook.com/vicunarafael486" target="_blank" rel="noopener">
                    Facebook
                </a>
            </p>

        </section>

        <hr>

        <section>

            <h2>Send Me a Message</h2>

            <form action="mailto:vicunarafael486@gmail.com" method="post" enctype="text/plain">

                <p>
                    <label for="name">Name:</label><br>

                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="email">
                        Email Address:
                    </label><br>

                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="phone">
                        Phone Number (Optional):
                    </label><br>

                    <input type="tel" id="phone" name="phone">
                </p>

                <p>
                    <label for="date">
                        Preferred Contact Date:
                    </label><br>

                    <input type="date" id="date" name="date">
                </p>

                <fieldset>

                    <legend>
                        Preferred Contact Method
                    </legend>

                    <p>
                        <input type="radio" id="instagram-contact" name="contact-method" value="Instagram">

                        <label for="instagram-contact">
                            Instagram
                        </label>
                    </p>

                    <p>
                        <input type="radio" id="email-contact" name="contact-method" value="Email">

                        <label for="email-contact">
                            Email
                        </label>
                    </p>

                    <p>
                        <input type="radio" id="phone-contact" name="contact-method" value="Phone">

                        <label for="phone-contact">
                            Phone
                        </label>
                    </p>

                </fieldset>

                <p>

                    <input type="checkbox" id="newsletter" name="newsletter">

                    <label for="newsletter">
                        Subscribe to updates
                    </label>

                </p>

                <p>
                    <label for="subject">
                        Subject:
                    </label><br>

                    <input type="text" id="subject" name="subject" required>
                </p>

                <p>
                    <label for="message">
                        Message:
                    </label><br>

                    <textarea id="message" name="message" rows="8" cols="40" required></textarea>
                </p>

                <p>
                    <button type="submit">
                        Submit
                    </button>
                </p>

            </form>

        </section>

    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Rafael</p>
    </footer>

</body>

</html>
